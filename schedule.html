<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0" >
  <title>GymBuddies – Schedule</title>
  <link rel="stylesheet" href="css/style.css" >
</head>
<body>

  <nav class="navbar">
    <div class="logo">
      <span class="logo-icon">🏋️</span>
      <span class="logo-text">GymBuddies</span>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="schedule.html" class="active">Schedule</a></li>
      <li><a href="calendar.html">Progress</a></li>
    </ul>
    <button type="button" id="themeToggle" class="theme-btn">🌙</button>
  </nav>

  <main>

    <section class="hero">
      <h1>💪 Weekly Workout Schedule</h1>
      <p>Click a day to see the exercises. Tick each one as you complete it!</p>
    </section>

    <section class="schedule-grid" id="scheduleGrid">
      <!-- JavaScript will build the day cards here -->
    </section>

    <div class="log-section">
      <button type="button" class="btn-primary" id="logWorkoutBtn">✅ Log Today's Workout</button>
      <p id="logMsg" class="success-msg"></p>
    </div>

  </main>

  <script src="js/schedule.js"></script>
</body>
</html>
