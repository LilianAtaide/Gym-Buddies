<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymBuddies</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-text">GymBuddies</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="schedule.html">Schedule</a></li>
            <li><a href="calendar.html">Progress</a></li>
        </ul>
        <button type="button" id="themeToggle" class="theme-btn">🌙</button>
        </nav>

    <main>

                <section class="hero">
                    <h1>Welcome to <span class="highlight">GymBuddies</span> 🏋️ </h1>
                    <p>Train together. Stay accountable. Crush your goals.</p>
                </section>

                <section class="signup-section">
                    <h2>Join the Squad</h2>
                    <form id="signupForm">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" placeholder="e.g. Lilian" autocomplete="name" >
                            <span class="error-msg" id="nameError"></span>
                        </div>

                        <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" >
                        <span class="error-msg" id="emailError"></span>
                        </div>

                        <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Min. 6 characters" autocomplete="new-password" >
                        <span class="error-msg" id="passwordError"></span>
                        </div>

                        <button type="submit" class="btn-primary">Join GymBuddies</button>
                    </form>
                    <p id="successMsg" class="success-msg"></p>
                </section>

                <section class="squad-feed">
                    <h2>🔔 Squad Activity</h2>
                    <ul id="activityFeed">
                    </ul>
                    <p id="emptyFeed" class="empty-msg">No activity yet. Be the first to log a workout!</p>
                 </section>

            </main>

             <script src="js/app.js"></script>
</body>
</html>
